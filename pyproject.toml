[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprmeta"
version = "0.1.0"
description = "Meta workspaces for Hyprland: a named offset applied to every monitor at once, with a fuzzy picker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Doerr" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hyprmeta = "hyprmeta.cli:main"

[tool.setuptools.packages.find]
include = ["hyprmeta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
